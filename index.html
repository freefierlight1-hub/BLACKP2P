<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BLACKP2P - سوق الحسابات الآمن</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#18181b">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' }
  if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); }
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<!-- ربط ملف التنسيقات (CSS) -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-shield-halved"></i></div>
      <div class="brand-text">
        <div class="brand-title" id="ttl">BLACKP2P</div>
        <div class="brand-sub">سوق آمن ومضمون</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="supportChat()" title="الدعم الفني"><i class="fa-solid fa-headset"></i></button>
      <button class="icon-btn" onclick="go('notes')" title="الإشعارات"><i class="fa-solid fa-bell"></i><b id="nb" class="hidden">0</b></button>
      <button class="icon-btn" id="theme-toggle" title="الوضع"><i class="fa-solid fa-moon dark:hidden"></i><i class="fa-solid fa-sun hidden dark:inline"></i></button>
      <div class="balance-chip"><i class="fa-solid fa-wallet"></i><span id="bal">0 ج</span></div>
    </div>
  </div>
</header>

<div id="tick" class="hidden"></div>

<!-- منطقة عرض المحتوى الرئيسي -->
<main id="app"></main>

<!-- الفوتر (الشروط وسياسة الخصوصية) -->
<div id="site-footer" style="text-align:center; padding:15px; font-size:11px; color:var(--text-3); font-weight:700; margin-top:20px;">
    <a href="terms.html" style="text-decoration:underline; color:var(--text-3);">الشروط والأحكام</a> 
    <span style="margin:0 8px;">|</span> 
    <a href="terms.html" style="text-decoration:underline; color:var(--text-3);">سياسة الخصوصية</a>
</div>

<nav id="nav" class="hidden">
  <div class="nav-inner">
    <button class="nav-item active" data-tab="feed" onclick="go('feed')"><i class="fa-solid fa-store"></i><span>السوق</span></button>
    <button class="nav-item" data-tab="add" onclick="go('add')"><i class="fa-solid fa-circle-plus"></i><span>إعلان</span></button>
    <button class="nav-item" data-tab="chats" onclick="go('chats')"><i class="fa-solid fa-comment"></i><span>الدردشة</span></button>
    <button class="nav-item" data-tab="wallet" onclick="go('wallet')"><i class="fa-solid fa-wallet"></i><span>المحفظة</span></button>
    <button class="nav-item" data-tab="me" onclick="go('me')"><i class="fa-solid fa-user"></i><span>حسابي</span></button>
  </div>
</nav>

<!-- ربط ملف الجافا سكريبت (تم التحديث إلى script2.js) -->
<script type="module" src="script.js"></script>

<!-- ربط ملف Service Worker لتشغيل التطبيق -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW error', err));
    });
  }
</script>

</body>
</html>
