<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

  if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); }
</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/* ===== الألوان الهادئة والشفافة ===== */
:root{ 
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#f8fafc; --surface-3:#f1f5f9; 
    --border:#e2e8f0; --border-2:#cbd5e1; --text:#0f172a; --text-2:#334155; --text-3:#64748b; --text-4:#94a3b8; 
    --glass:rgba(255,255,255,0.7); 
    --success-bg:rgba(16,185,129,0.1); --success-bd:rgba(16,185,129,0.3); --success-tx:#047857; 
    --danger-bg:rgba(239,68,68,0.1); --danger-bd:rgba(239,68,68,0.3); --danger-tx:#b91c1c; 
    --warn-bg:rgba(245,158,11,0.1); --warn-bd:rgba(245,158,11,0.3); --warn-tx:#b45309; 
    --info-bg:rgba(59,130,246,0.1); --info-bd:rgba(59,130,246,0.3); --info-tx:#1d4ed8; 
    --gold-bg:rgba(234,179,8,0.1); --gold-bd:rgba(234,179,8,0.3); --gold-tx:#854d0e; 
    --shadow-sm:0 1px 2px rgba(0,0,0,0.05); --shadow:0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); 
    --radius:12px;
}
html.dark{ 
    --bg:#0f1115; --surface:#181a20; --surface-2:#1f2228; --surface-3:#262930; 
    --border:#2d3139; --border-2:#3f4450; --text:#f8fafc; --text-2:#cbd5e1; --text-3:#94a3b8; --text-4:#64748b; 
    --glass:rgba(24,26,32,0.7);
    --success-bg:rgba(16,185,129,0.15); --success-tx:#34d399; 
    --danger-bg:rgba(239,68,68,0.15); --danger-tx:#f87171; 
    --warn-bg:rgba(245,158,11,0.15); --warn-tx:#fbbf24; 
    --info-bg:rgba(59,130,246,0.15); --info-tx:#60a5fa; 
    --gold-bg:rgba(234,179,8,0.15); --gold-tx:#fde047;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3); --shadow:0 4px 6px -1px rgba(0,0,0,0.3);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5;overflow-x:hidden;padding-bottom:70px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;color:inherit;width:100%;padding:10px 12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;outline:none;margin-bottom:10px;transition:0.2s}
input:focus,textarea:focus,select:focus{border-color:var(--info-tx);background:var(--surface);box-shadow:0 0 0 3px var(--info-bg)}

/* Header & Nav */
#header{position:sticky;top:0;z-index:50;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.header-inner{max-width:1400px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:60px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--text);color:var(--surface);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.global-search{flex:1;max-width:400px;position:relative;margin:0 10px;}
.global-search input{margin:0;padding-right:35px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;height:38px;}
.global-search i{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-4);font-size:12px;}
#tabs{position:sticky;top:60px;z-index:40;background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tabs-inner{max-width:1400px;margin:0 auto;display:flex;gap:4px;padding:8px 10px;min-width:max-content}
.nav-icon{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;color:var(--text-3);font-size:12px;font-weight:800;white-space:nowrap;transition:0.2s}
.nav-icon:hover{background:var(--surface-2)}
.nav-icon.active{background:var(--text);color:var(--surface);box-shadow:var(--shadow-sm)}
.nav-icon.logout{color:var(--danger-tx)}
#v{max-width:1400px;margin:0 auto;padding:16px 14px 40px;min-height:calc(100vh - 110px)}

/* UI Elements */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);transition:0.2s}
.card:hover{border-color:var(--border-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:900;border:1px solid transparent;min-height:36px;transition:0.2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn-primary{background:var(--text);color:var(--surface)}
.btn-ghost{background:var(--surface-2);color:var(--text-2);border-color:var(--border)}
.btn-success{background:var(--success-bg);color:var(--success-tx);border-color:var(--success-bd)}
.btn-danger{background:var(--danger-bg);color:var(--danger-tx);border-color:var(--danger-bd)}
.btn-warning{background:var(--warn-bg);color:var(--warn-tx);border-color:var(--warn-bd)}
.btn-info{background:var(--info-bg);color:var(--info-tx);border-color:var(--info-bd)}
.btn-gold{background:var(--gold-bg);color:var(--gold-tx);border-color:var(--gold-bd)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:10px;font-weight:900;border:1px solid;white-space:nowrap}
.badge-success{background:var(--success-bg);border-color:var(--success-bd);color:var(--success-tx)}
.badge-danger{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger-tx)}
.badge-warning{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-tx)}
.badge-info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-tx)}
.badge-neutral{background:var(--surface-3);border-color:var(--border);color:var(--text-2)}
.stats-grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:12px;margin-bottom:16px}
@media (max-width:900px){.stats-grid{grid-template-columns:repeat(3, 1fr)}}
@media (max-width:640px){.stats-grid{grid-template-columns:repeat(2, 1fr);gap:8px}}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow-sm);transition:0.2s}
.stat-card:hover{border-color:var(--border-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.stat-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;border:1px solid}
.stat-label{font-size:11px;font-weight:800;color:var(--text-3)}
.stat-value{font-size:22px;font-weight:900;color:var(--text)}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:900;color:var(--text);padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border)}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (max-width:640px){.grid-2{grid-template-columns:1fr}}
.skeleton{background:var(--surface-3);border-radius:8px;animation:skeletonPulse 1.2s ease-in-out infinite}@keyframes skeletonPulse{0%,100%{opacity:0.6}50%{opacity:1}}

/* SweetAlert Overrides */
.swal2-popup{border-radius:16px!important;font-family:'Cairo',sans-serif!important;padding:20px!important;background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border)!important;}
.swal2-title{font-weight:900!important;font-size:16px!important;color:var(--text)!important}
.swal2-confirm{background:var(--text)!important;color:var(--surface)!important;border-radius:10px!important;font-weight:900!important;padding:10px 20px!important}
.swal2-cancel{background:var(--surface-2)!important;color:var(--text-2)!important;border-radius:10px!important;font-weight:900!important;padding:10px 20px!important}

/* Chat Styles */
.chat-shell{display:flex;flex-direction:column;height:calc(100dvh - 130px);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;max-width:900px;margin:0 auto;box-shadow:var(--shadow)}
.chat-header{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface-2);border-bottom:1px solid var(--border);flex-shrink:0}
.chat-avatar{width:40px;height:40px;border-radius:12px;background:var(--text);color:var(--surface);font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chat-info{flex:1;min-width:0}
.chat-name{font-size:14px;font-weight:900;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-status{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--text-3);margin-top:2px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--success-tx);flex-shrink:0}.status-dot.closed{background:var(--danger-tx)}.status-dot.frozen{background:var(--warn-tx)}
.deal-panel{background:var(--surface);border-bottom:1px solid var(--border);padding:12px;flex-shrink:0;box-shadow:0 4px 6px -6px rgba(0,0,0,0.1);z-index:10}
.deal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.deal-amount{font-size:18px;font-weight:900;color:var(--success-tx)}
.deal-steps{display:flex;align-items:center;gap:6px}.deal-step{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.deal-step-circle{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;border:2px solid var(--border-2);background:var(--surface);color:var(--text-4)}
.deal-step-circle.done{background:var(--success-tx);border-color:var(--success-tx);color:#fff}
.deal-step-label{font-size:10px;font-weight:800;color:var(--text-4)}.deal-step-label.done{color:var(--success-tx)}
.chat-messages{flex:1;min-height:0;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--surface-3)}
.msg-row{display:flex;max-width:100%}.msg-row.me{justify-content:flex-start}.msg-row.other{justify-content:flex-end}
.msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;font-weight:600;line-height:1.5;word-break:break-word;box-shadow:var(--shadow-sm)}
.msg-bubble.me{background:var(--text);color:var(--surface);border-bottom-right-radius:4px}
.msg-bubble.other{background:var(--surface);color:var(--text);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-time{font-size:9px;font-weight:800;opacity:0.6;margin-top:4px;display:block}
.msg-system{display:flex;justify-content:center;margin:6px 0}.msg-system-bubble{background:var(--surface-2);border:1px solid var(--border);padding:6px 14px;border-radius:12px;font-size:11px;font-weight:800;color:var(--text-3)}
.msg-admin{display:flex;justify-content:center;margin:6px 0}.msg-admin-bubble{background:var(--info-bg);border:1px solid var(--info-bd);padding:8px 16px;border-radius:12px;font-size:12px;font-weight:900;color:var(--info-tx);white-space:pre-line;text-align:right;box-shadow:var(--shadow-sm)}
.chat-input-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--border);flex-shrink:0}
.chat-input-bar input{margin:0;flex:1;background:var(--surface-2);min-height:42px;border-radius:20px;padding:0 16px}
.chat-input-bar .icon-btn{width:40px;height:40px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:0.2s}

/* Side Panel (Dispute / Support Tools) */
.side-panel { position: fixed; top: 0; right: -360px; width: 340px; height: 100vh; background: var(--surface); border-left: 1px solid var(--border); z-index: 1000; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: -10px 0 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; }
.side-panel.open { right: 0; }
.panel-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter:blur(2px); z-index: 999; opacity: 0; pointer-events: none; transition: 0.3s; }
.panel-overlay.open { opacity: 1; pointer-events: auto; }
.panel-header { padding: 24px 20px; text-align: center; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.panel-body { flex: 1; overflow-y: auto; padding: 16px; }
.tools-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
.tools-title { font-size: 12px; font-weight: 900; display: flex; align-items: center; gap: 6px; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.action-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 12px 8px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); font-size: 11px; font-weight: 800; color: var(--text-2); cursor: pointer; transition: 0.2s; box-shadow: var(--shadow-sm); }
.action-btn:hover { border-color: var(--border-2); transform: translateY(-2px); box-shadow: var(--shadow); }
.action-btn i { font-size: 18px; }
.action-btn.danger { color: var(--danger-tx); background: var(--danger-bg); border-color: var(--danger-bd); }
.action-btn.warning { color: var(--warn-tx); background: var(--warn-bg); border-color: var(--warn-bd); }
.action-btn.success { color: var(--success-tx); background: var(--success-bg); border-color: var(--success-bd); }
.action-btn.info { color: var(--info-tx); background: var(--info-bg); border-color: var(--info-bd); }
.internal-notes { background: var(--gold-bg); border: 1px solid var(--gold-bd); border-radius: 12px; padding: 12px; margin-top:16px; }

/* Bulk Bar */
.bulk-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--text); color: var(--surface); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 -4px 15px rgba(0,0,0,0.2); border-top-left-radius: 16px; border-top-right-radius: 16px;}
.bulk-bar.show { transform: translateY(0); }
.bulk-count { font-size: 14px; font-weight: 900; }
.bulk-actions { display: flex; gap: 8px; }
.bulk-btn { background: rgba(255,255,255,0.15); padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 800; color: #fff; cursor: pointer; transition:0.2s;}
.bulk-btn:hover{background: rgba(255,255,255,0.25);}
.bulk-btn.danger { background: var(--danger-tx); }
.hide-scroll::-webkit-scrollbar{display:none}.hide-scroll{scrollbar-width:none}

/* ✅ تصميم نافذة المستخدم المتجاوب */
.user-info-modal .swal2-html-container { margin: 0 !important; padding: 0 !important; overflow: hidden !important; }
.modal-tabs { display: flex; overflow-x: auto; gap: 4px; padding: 4px; background: var(--surface-2); border-radius: 10px; margin-bottom: 12px; scrollbar-width: none; }
.modal-tabs::-webkit-scrollbar { display: none; }
.modal-tab { flex: 0 0 auto; padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: 900; color: var(--text-3); white-space: nowrap; border: none; background: transparent; transition: 0.2s; }
.modal-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }
.info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.info-cell { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; justify-content: center; }
.info-label { font-size: 9px; font-weight: 800; color: var(--text-4); margin-bottom: 2px; }
.info-value { font-size: 11px; font-weight: 900; color: var(--text); word-break: break-all; }
</style>
</head>

<header id="header">
  <div class="header-inner">

      <div class="brand-mark">B</div>

        <div class="brand-sub" style="font-size:10px; color:var(--text-3); font-weight:700;">BLACKP2P</div>

    <div class="global-search">

      </div>
    </div>
  </div>
</header>

<div id="maintenance-banner" class="hidden" style="background:var(--warn-bg);border-bottom:1px solid var(--warn-bd);color:var(--warn-tx);padding:10px;text-align:center;font-size:12px;font-weight:900;">
  <i class="fa-solid fa-triangle-exclamation"></i> وضع الصيانة مفعّل (الموقع مغلق للمستخدمين)
</div>

import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    if(window._exportType === 'posts') headers = [{key:'id',label:'ID'},{key:'game',label:'اللعبة'},{key:'sellerName',label:'البائع'},{key:'price',label:'السعر'},{key:'status',label:'الحالة'}];

const getTabsByRole = (role) => {
    const allTabs = [ ['dash','الرئيسية','fa-house'], ['posts','الإعلانات','fa-rectangle-list'], ['dep','الشحن','fa-wallet'], ['wd','السحب','fa-money-bill-transfer'], ['ver','التوثيق','fa-id-card'], ['pay','الأرباح','fa-sack-dollar'], ['ref','النزاعات','fa-scale-balanced'], ['deals','الصفقات','fa-handshake'], ['cpn','الكوبونات','fa-ticket'], ['users','المستخدمون','fa-users'], ['chats','الدردشات','fa-comments'], ['note','إشعارات','fa-bell'], ['set','الإعدادات','fa-gear'], ['log','السجل','fa-clipboard-list'] ];
    if (role === 'owner' || role === 'super_admin' || !role) return allTabs;
    if (role === 'accountant') return allTabs.filter(t => ['dash','dep','wd','pay','ref','deals'].includes(t[0]));

const statusBadge = (status) => {
  const map = { pending: { cls: 'badge-warning', label: 'معلق', icon: 'fa-clock' }, approved: { cls: 'badge-success', label: 'مقبول', icon: 'fa-check' }, rejected: { cls: 'badge-danger', label: 'مرفوض', icon: 'fa-xmark' }, active: { cls: 'badge-success', label: 'نشط', icon: 'fa-check' }, sold: { cls: 'badge-info', label: 'مباع', icon: 'fa-tag' }, deleted: { cls: 'badge-danger', label: 'محذوف', icon: 'fa-trash' }, held: { cls: 'badge-warning', label: 'محجوز', icon: 'fa-lock' }, delivered: { cls: 'badge-info', label: 'مسلّم', icon: 'fa-box' }, completed: { cls: 'badge-success', label: 'مكتمل', icon: 'fa-check-double' }, cancelled: { cls: 'badge-danger', label: 'ملغي', icon: 'fa-ban' }, refunded: { cls: 'badge-danger', label: 'مسترد', icon: 'fa-rotate-left' }, disputed: { cls: 'badge-warning', label: 'نزاع', icon: 'fa-triangle-exclamation' }, verified: { cls: 'badge-success', label: 'موثق', icon: 'fa-check' }, processed: { cls: 'badge-success', label: 'معالج', icon: 'fa-check' } };
  const cfg = map[status] || { cls: 'badge-neutral', label: status, icon: 'fa-circle' };
  return `<span class="badge ${cfg.cls}"><i class="fa-solid ${cfg.icon}"></i>${cfg.label}</span>`;
};

window.toggleSelect = (type, id) => {
    const set = type === 'post' ? selectedPosts : selectedUsers;
    if (set.has(id)) set.delete(id); else set.add(id);
    updateBulkBar(type);
};

window.updateBulkBar = (type) => {
    const set = type === 'post' ? selectedPosts : selectedUsers;
    const bar = $('bulk-bar');
    if (set.size > 0) {
        $('bulk-count').textContent = `${set.size} عنصر محدد`;
        if (type === 'post') {
            $('bulk-actions').innerHTML = `
                <button class="bulk-btn danger" onclick="bulkDeletePosts()"><i class="fa-solid fa-trash"></i> حذف</button>
                <button class="bulk-btn" onclick="bulkApprovePosts()"><i class="fa-solid fa-check"></i> قبول</button>
            `;
        } else {
            $('bulk-actions').innerHTML = `
                <button class="bulk-btn danger" onclick="bulkBanUsers()"><i class="fa-solid fa-ban"></i> حظر</button>
                <button class="bulk-btn" onclick="bulkNotifyUsers()"><i class="fa-solid fa-bell"></i> إشعار</button>
            `;
        }
        bar.classList.add('show');
    } else { bar.classList.remove('show'); }
};

window.bulkBanUsers = async () => { if (!await ask(`حظر ${selectedUsers.size} مستخدم؟`)) return; const r = await reason('سبب الحظر الجماعي'); Swal.fire({title:'جاري الحظر...', didOpen:()=>Swal.showLoading()}); try { const updates = {}; selectedUsers.forEach(id => { updates[`users/${id}/suspended`] = true; updates[`users/${id}/banReason`] = r; }); await update(ref(db), updates); await log('حظر جماعي', `حظر ${selectedUsers.size} - ${r}`); selectedUsers.clear(); updateBulkBar('user'); Swal.close(); ok('تم'); show('users'); } catch(e) { Swal.close(); bad(e); } };

window.globalSearch = async (val) => {
    if(!val || val.length < 3) return bad(new Error('أدخل 3 أحرف على الأقل للبحث'));
    Swal.fire({title:'جاري البحث...', didOpen:()=>Swal.showLoading(), showConfirmButton:false});
    try {
        // Search by Email
        const usersSnap = await get(query(R('users'), orderByChild('email'), equalTo(val)));
        if(usersSnap.exists()) { Swal.close(); const uid = Object.keys(usersSnap.val())[0]; return userInfo(uid); }
        
        // Search by User ID
        const userSnap = await get(R('users/'+val));
        if(userSnap.exists()) { Swal.close(); return userInfo(val); }

        // Search by Post ID
        const postsSnap = await get(R('posts/'+val));
        if(postsSnap.exists()) { Swal.close(); return postInfo(val); }

        Swal.close(); bad(new Error('لم يتم العثور على نتائج مطابقة.'));
    } catch(e) { Swal.close(); bad(e); }
};

window.viewPrivateInfo = async (pid) => {
  if(!pid) return bad(new Error('غير موجود'));
  try {
    Swal.fire({title:'جاري فك التشفير بأمان...', didOpen:()=>Swal.showLoading(), showConfirmButton:false});
    const idToken = await auth.currentUser.getIdToken();
    const response = await fetch(WORKER_URL + "/decrypt", { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken }, body: JSON.stringify({ postId: pid }) });
    const result = await response.json();
    if (!response.ok) throw new Error(result.error || 'فشل الاتصال بالخادم');
    Swal.fire({ title:'بيانات الحساب', html:`<div style="background:var(--warn-bg);border:1px solid var(--warn-bd);padding:14px;border-radius:10px;text-align:left;margin-top:6px" dir="ltr"><p style="font-size:13px;margin-bottom:8px;color:var(--warn-tx);"><b>Email:</b> <span style="user-select:all;background:rgba(0,0,0,0.1);padding:2px 6px;border-radius:4px;">${E(result.email || 'خطأ')}</span></p><p style="font-size:13px;color:var(--warn-tx);"><b>Password:</b> <span style="user-select:all;background:rgba(0,0,0,0.1);padding:2px 6px;border-radius:4px;">${E(result.password || 'خطأ')}</span></p></div>`, confirmButtonText: 'إغلاق' });
    await log('فك تشفير حساب', `post=${pid}`);
  } catch(e) { Swal.close(); bad(e); }
};

const checkPending = async () => {
    try {
        const [dep, wd, ver, refs] = await Promise.all([get(R('deposits')), get(R('withdrawals')), get(R('user_verifications')), get(R('refund_queue'))]);
        const count = (snap) => Object.values(snap.val() || {}).filter(x => x.status === 'pending').length;
        const pendingCount = count(dep) + count(wd) + count(ver) + count(refs);
        const badge = document.getElementById('notif-badge');
        if (badge) { if (pendingCount > 0) { badge.innerText = pendingCount > 99 ? '+99' : pendingCount; badge.classList.remove('hidden'); } else { badge.classList.add('hidden'); } }
    } catch (e) {}
};

window.deleteUserAccount = async (uid) => {
    if (!uid || uid === 'admin_support') return;
    if (!await ask('حذف هذا الحساب نهائياً؟ سيتم مسح بياناته!')) return;
    Swal.fire({title:'جاري مسح البيانات...', didOpen:()=>Swal.showLoading()});
    try {
        const updates = {}; updates[`users/${uid}`] = null; updates[`notifications/${uid}`] = null;
        const userPosts = await get(query(R('posts'), orderByChild('sellerId'), equalTo(uid)));
        if(userPosts.exists()) { Object.keys(userPosts.val()).forEach(pid => { updates[`posts/${pid}`] = null; updates[`post_private/${pid}`] = null; }); }
        await update(ref(db), updates); Swal.close(); ok('تم الحذف.'); show('users');
    } catch(e) { Swal.close(); bad(e); }
};

window.createPromoCode = async () => {
    const { value: formValues } = await Swal.fire({ 
        title: 'إنشاء كوبون جديد', 
        html: `<p style="font-size:12px; color:var(--text-3); margin-bottom:12px; font-weight:700;">اترك حقل UID فارغاً لإنشاء كوبون عام يمكن لأي شخص استخدامه.</p>

        showCancelButton: true, 
        confirmButtonText: 'إنشاء الكوبون', 
        cancelButtonText: 'إلغاء', 
        preConfirm: () => { 
            const uid = document.getElementById('swal-uid').value.trim(); 
            const amount = document.getElementById('swal-amount').value.trim(); 
            if (!amount || amount < 1) { Swal.showValidationMessage('أدخل مبلغاً صالحاً'); return false; } 
            return { uid, amount: Number(amount) };

        await set(R('promo_codes/' + code), { amount: formValues.amount, status: 'active', createdAt: Date.now(), targetUser: formValues.uid || null });
        Swal.close();
        Swal.fire({ title: 'تم إنشاء الكوبون بنجاح!', html: `<p style="font-size:13px;margin-bottom:12px;color:var(--text-2);font-weight:700;">أعط هذا الكود للمستخدم ليقوم بإدخاله في المحفظة:</p><b style="font-size:24px; color:var(--success-tx); letter-spacing:2px; background:var(--success-bg); border:1px dashed var(--success-bd); padding:10px 20px; border-radius:10px; display:inline-block;">${code}</b><p style="font-size:13px;margin-top:12px; font-weight:900;">القيمة: ${formValues.amount} ج</p>`, confirmButtonText: 'نسخ الكود' }).then(r => { if(r.isConfirmed) navigator.clipboard.writeText(code); });
        show('cpn');
    } catch(e) { Swal.close(); bad(e); }

}

window.banDevice = async (uid) => { if (!uid) return; try { const u = (await get(R('users/'+uid))).val() || {}; if(!u.deviceInfo) return bad(new Error('لا توجد بيانات جهاز لهذا المستخدم')); if(!await ask('سيتم حظر جميع الحسابات التي تستخدم نفس الجهاز/المتصفح. متأكد؟')) return; Swal.fire({title:'جاري الحظر الشامل...', didOpen:()=>Swal.showLoading()}); const usersSnap = await get(R('users')); const users = usersSnap.val() || {}; let count = 0; const updates = {}; Object.entries(users).forEach(([id, user]) => { if(user.deviceInfo === u.deviceInfo) { updates[`users/${id}/suspended`] = true; updates[`users/${id}/banReason`] = 'حظر الجهاز (تلاعب)'; updates[`users/${id}/banUntil`] = null; count++; } }); await update(ref(db), updates); Swal.close(); await log('حظر جهاز', `تم حظر ${count} حسابات مرتبطة بنفس الجهاز`); ok(`تم حظر ${count} حسابات بنجاح`); } catch(e) { Swal.close(); bad(e); } };

    $('chat-avatar-wrap').textContent = (displayName || '?').charAt(0);
    
    const statusEl = $('chat-status');
    if(c.status === 'closed') { statusEl.innerHTML = '<span class="status-dot closed"></span><span>مغلقة</span>'; }
    else if(c.frozen) { statusEl.innerHTML = '<span class="status-dot frozen"></span><span>مجمدة (نزاع)</span>'; }
    else { statusEl.innerHTML = '<span class="status-dot"></span><span>نشطة</span>'; }
    
    const assignBtn = $('assign-btn');
    if (c.assignedTo === me.email) {
        assignBtn.innerHTML = `<span class="badge badge-info" style="font-size:10px;padding:4px 8px;border-radius:6px;"><i class="fa-solid fa-check"></i> مسند لك</span>`;
    } else if (c.assignedTo) {
        assignBtn.innerHTML = `<span class="badge badge-neutral" style="font-size:10px;padding:4px 8px;border-radius:6px;"><i class="fa-solid fa-user-tie"></i> ${E(c.assignedTo.split('@')[0])}</span>`;
    } else {
        const kAssign = 'h'+(hc++); H[kAssign] = async () => { await update(R('chats/'+cid), {assignedTo: me.email}); ok('تم التعيين لك'); };
        assignBtn.innerHTML = `<button class="btn btn-ghost" style="padding:4px 10px;font-size:11px;min-height:30px;border-radius:6px;" onclick="A('${kAssign}')"><i class="fa-solid fa-hand"></i> تعيين</button>`;
    }

    const kFreeze='h'+(hc++);H[kFreeze]=async()=>{await update(R('chats/'+cid),{frozen:!c.frozen});await log(c.frozen?'رفع تجميد':'تجميد',cid)};
    $('fz').innerHTML=`<button class="icon-btn" style="width:32px;height:32px;border-radius:8px;${c.frozen?'background:var(--info-bg);color:var(--info-tx);border-color:var(--info-bd)':'background:var(--warn-bg);color:var(--warn-tx);border-color:var(--warn-bd)'}" onclick="event.stopPropagation(); A('${kFreeze}')" title="${c.frozen?'إلغاء التجميد':'تجميد الدردشة'}"><i class="fa-solid fa-${c.frozen?'lock-open':'snowflake'}" style="font-size:12px"></i></button>`;
    const kClose='h'+(hc++);H[kClose]=async()=>{if(!await ask('إغلاق؟'))return;await update(R('chats/'+cid),{status:'closed'});await log('إغلاق',cid);ok('تم');show('chats')};
    if(c.status !== 'closed') { $('cl').innerHTML=`<button class="icon-btn" style="width:32px;height:32px;border-radius:8px;background:var(--danger-bg);color:var(--danger-tx);border-color:var(--danger-bd)" onclick="event.stopPropagation(); A('${kClose}')" title="إغلاق الدردشة"><i class="fa-solid fa-xmark" style="font-size:14px"></i></button>`; }
    else { $('cl').innerHTML=''; $('mi').disabled = true; $('mb').disabled = true; $('mb').style.opacity=0.5; }
    
    if(c.dealId && typeof c.dealId === 'string' && c.dealId.trim() !== '') {
        const dp = $('dp');
        live.push(onValue(R('deals/'+c.dealId),x=>{ const d = x.val(); if(!d) return; 
            // إخفاء أزرار النزاع إذا كانت الصفقة منتهية
            if (d.status === 'completed' || d.status === 'refunded' || d.status === 'cancelled') {
                $('dispute-admin-tools').style.display = 'none';
            } else {
                $('dispute-admin-tools').style.display = 'block';
            }

            const steps = ['held','delivered','completed']; const idx = steps.indexOf(d.status); dp.innerHTML = `<div class="deal-panel"><div class="deal-header"><b class="deal-amount">${d.amount} ج</b>${statusBadge(d.status)}</div><div class="deal-steps"><div class="deal-step"><div class="deal-step-circle done"><i class="fa-solid fa-check"></i></div><span class="deal-step-label done">الدفع</span></div><div class="deal-step"><div class="deal-step-circle ${idx>=1?'done':''}"><i class="fa-solid fa-box"></i></div><span class="deal-step-label ${idx>=1?'done':''}">التسليم</span></div><div class="deal-step"><div class="deal-step-circle ${idx>=2?'done':''}"><i class="fa-solid fa-flag-checkered"></i></div><span class="deal-step-label ${idx>=2?'done':''}">الاكتمال</span></div></div></div>`; }));
    } else { $('dp').innerHTML = ''; }
  }));
  live.push(onValue(query(R(`chats/${cid}/messages`),limitToLast(200)),s=>{
    const a=Object.values(s.val()||{}).sort((x,y)=>x.createdAt-y.createdAt);
    $('ms').innerHTML=a.map(m=>{
        const time = new Date(m.createdAt).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'});
        if(m.type === 'image' && m.imageUrl) { const isMe = m.senderId === me.uid; return `<div class="msg-row ${isMe?'me':'other'}"><div class="msg-bubble ${isMe?'me':'other'}" style="padding:4px"><img src="${m.imageUrl}" style="max-height:200px;border-radius:12px;display:block;cursor:pointer" onclick="zoom(this.src)"><span class="msg-time" style="padding:0 4px;">${time}</span></div></div>`; }
        else if(m.type === 'transaction') { return `<div class="msg-system"><div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:12px;text-align:right;max-width:280px;box-shadow:var(--shadow-sm);" dir="rtl"><div style="font-weight:900;color:var(--success-tx);margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--border);padding-bottom:6px;"><span><i class="fa-solid fa-receipt"></i> ${m.txType || 'معاملة'}</span><span style="color:var(--text-4);font-size:10px" dir="ltr">#${(m.txId||'').slice(0,8)}</span></div><div style="display:flex;justify-content:space-between;color:var(--text-3);margin-bottom:4px;font-weight:700;"><span>المبلغ:</span><b style="color:var(--text)">${m.amount} ج</b></div><div style="display:flex;justify-content:space-between;color:var(--text-3);font-weight:700;"><span>الحالة:</span>${statusBadge(m.status)}</div></div></div>`; }
        else if(m.type === 'system') { return `<div class="msg-system"><div class="msg-system-bubble"><i class="fa-solid fa-circle-info"></i> ${E(m.text)}</div></div>`; }
        else if(m.type === 'admin') { return `<div class="msg-admin"><div class="msg-admin-bubble"><i class="fa-solid fa-headset" style="margin-bottom:4px;display:block;font-size:16px;"></i> ${E(m.text)}</div></div>`; }
        const isMe = m.senderId === me.uid;
        return `<div class="msg-row ${isMe?'me':'other'}"><div class="msg-bubble ${isMe?'me':'other'}">${E(m.text)}<span class="msg-time">${time}</span></div></div>`;
    }).join('') || '<div style="text-align:center;padding:30px;color:var(--text-4);font-size:13px;font-weight:700;">لا توجد رسائل بعد</div>';
    $('ms').scrollTop=1e9;
  }));
}

window.adminResolveDispute = async (cid, action) => {
    const chat = (await get(R('chats/' + cid))).val();
    if (!chat || !chat.dealId) return bad(new Error('لم يتم العثور على الصفقة'));
    const deal = (await get(R('deals/' + chat.dealId))).val();
    
    if (deal.status === 'completed' || deal.status === 'refunded' || deal.status === 'cancelled') {
        return bad(new Error('هذه الصفقة تم حلها بالفعل ولا يمكن اتخاذ إجراء جديد.'));
    }

    if (action === 'release') {
        if (!await ask('تأكيد تحرير المبلغ للبائع وإنهاء النزاع؟')) return;
        Swal.fire({title:'جاري المعالجة...', didOpen:()=>Swal.showLoading()});
        try {
            const com = Math.round(deal.amount * (Number(S.commission) || 0) / 100);
            const sellerPayout = deal.amount - com;
            await credit(deal.sellerId, sellerPayout);
            const updates = {};
            updates[`deals/${chat.dealId}/status`] = 'completed';
            updates[`refund_queue/${chat.dealId}/status`] = 'rejected';
            updates[`chats/${cid}/frozen`] = false;
            updates[`chats/${cid}/dealStatus`] = 'completed';
            await update(ref(db), updates);
            await set(push(R(`chats/${cid}/messages`)), {senderId: me.uid, type: 'admin', text: `✅ قرار الإدارة: تم رفض النزاع وتحرير مبلغ ${sellerPayout} ج لصالح البائع.`, createdAt: Date.now()});
            await notify(deal.sellerId, 'تم حل النزاع لصالحك', `تم إيداع ${sellerPayout} ج في محفظتك.`);
            await notify(deal.buyerId, 'تم رفض النزاع', 'تم تحويل المبلغ للبائع.');
            Swal.close(); ok('تم تحرير المبلغ'); show('chats');
        } catch(e) { Swal.close(); bad(e); }
    } 
    else if (action === 'refund') {
        if (!await ask('تأكيد استرداد المبلغ للمشتري وإلغاء الصفقة؟')) return;
        Swal.fire({title:'جاري المعالجة...', didOpen:()=>Swal.showLoading()});
        try {
            await credit(deal.buyerId, deal.amount);
            const updates = {};
            updates[`deals/${chat.dealId}/status`] = 'refunded';
            updates[`refund_queue/${chat.dealId}/status`] = 'approved';
            updates[`chats/${cid}/frozen`] = false;
            updates[`chats/${cid}/dealStatus`] = 'refunded';
            await update(ref(db), updates);
            await set(push(R(`chats/${cid}/messages`)), {senderId: me.uid, type: 'admin', text: `⚠️ قرار الإدارة: تم قبول النزاع واسترداد مبلغ ${deal.amount} ج لصالح المشتري.`, createdAt: Date.now()});
            await notify(deal.buyerId, 'تم قبول النزاع', `تم إرجاع ${deal.amount} ج إلى محفظتك.`);
            await notify(deal.sellerId, 'تم استرداد المبلغ للمشتري', 'تم إلغاء الصفقة.');
            Swal.close(); ok('تم الاسترداد'); show('chats');
        } catch(e) { Swal.close(); bad(e); }
    }
};

window.sendDealInfoToChat = async (cid) => {
    try {
        const chat = (await get(R('chats/' + cid))).val();
        const deal = (await get(R('deals/' + chat.dealId))).val();
        const post = (await get(R('posts/' + deal.postId))).val();
        const infoText = `🧾 تفاصيل الصفقة المتنازع عليها\n--------------------\nرقم الصفقة: #${deal.id ? deal.id.slice(0,8) : chat.dealId.slice(0,8)}\nاللعبة: ${post ? post.game : 'غير معروف'}\nالمبلغ: ${deal.amount} ج\nالمشتري: ${chat.buyerName}\nالبائع: ${chat.sellerName}\nحالة الدفع: تم الحجز`;
        await set(push(R(`chats/${cid}/messages`)), { senderId: me.uid, type: 'admin', text: infoText, createdAt: Date.now(), read: false });
        await update(R('chats/'+cid), {lastMessage: '🧾 تفاصيل الصفقة', updatedAt: Date.now(), adminRead: true});
        ok('تم إرفاق التفاصيل');
    } catch(e) { bad(e); }
};

window.requestEvidence = async (cid) => {
    const {value: msg} = await Swal.fire({title:'طلب أدلة وإثباتات', input:'textarea', inputValue:'يرجى من الطرفين إرفاق صور إثبات (لقطات شاشة للمحادثات أو الحساب) لتسهيل حل النزاع.', showCancelButton:true, confirmButtonText:'إرسال'});
    if(!msg) return;
    try {
        await set(push(R(`chats/${cid}/messages`)), { senderId: me.uid, type: 'admin', text: `📸 طلب إثباتات:\n${msg}`, createdAt: Date.now(), read: false });
        ok('تم إرسال الطلب');
    } catch(e) { bad(e); }
};

window.saveAdminNote = async (uid) => { if (!uid) return; const note = $('admin-note-input').value.trim().slice(0, 300); try { await update(R('users/' + uid), { adminNote: note }); ok('تم الحفظ'); } catch(e) { bad(e); } };
window.sendQuickNote = async (uid) => { if (!uid) return; const { value: text } = await Swal.fire({ title: 'إرسال إشعار سريع', input: 'textarea', inputPlaceholder: 'اكتب نص الإشعار...', showCancelButton: true, confirmButtonText: 'إرسال', cancelButtonText: 'إلغاء' }); if (!text) return; try { await set(push(R('notifications/' + uid)), { title: 'إشعار من الإدارة', body: text.slice(0, 200), type: 'info', popup: true, read: false, createdAt: Date.now() }); ok('تم الإرسال'); } catch(e) { bad(e); } };
window.sendUserInfoCard = async () => { const uid = window._chatCtx.uid; const cid = window._chatCtx.cid; if (!uid || uid === 'undefined') return bad(new Error('لم يتم التعرف على المستخدم')); try { Swal.fire({title:'جاري جلب البيانات...', didOpen:()=>Swal.showLoading()}); const u = (await get(R('users/'+uid))).val(); Swal.close(); if(!u) return bad(new Error('المستخدم غير موجود')); const infoText = `📋 بطاقة المستخدم\n--------------------\nالاسم: ${u.name||'غير معروف'}\nالإيميل: ${u.email||'لا يوجد'}\nالرصيد: ${u.balance||0} ج\nالحالة: ${u.suspended ? 'محظور 🚫' : 'نشط ✅'}\nUID: ${uid}`; await set(push(R(`chats/${cid}/messages`)), { senderId: me.uid, type: 'admin', text: infoText, createdAt: Date.now(), read: false }); await update(R('chats/'+cid), {lastMessage: '📋 بطاقة المستخدم', updatedAt: Date.now(), adminRead: true}); ok('تم الإرسال'); } catch(e) { Swal.close(); bad(e); } };
window.adminToggleBan = async (uid) => { if (!uid || uid === 'admin_support') return; try { const u = (await get(R('users/'+uid))).val() || {}; if(u.suspended) { await update(R('users/'+uid), {suspended:false, banReason:null, banUntil:null}); return ok('تم رفع الحظر'); } const {value: duration} = await Swal.fire({ title: 'حظر', text: 'المدة', input: 'select', inputOptions: {'1': 'يوم','7': '7 أيام','30': '30 يوماً','permanent': 'دائم'}, inputPlaceholder: 'اختر', showCancelButton: true, confirmButtonText: 'التالي', cancelButtonText: 'إلغاء' }); if(!duration) return; const r = await reason('السبب (سيظهر للمستخدم)'); let banUntil = null; if(duration !== 'permanent') banUntil = Date.now() + (parseInt(duration) * 86400000); await update(R('users/'+uid), { suspended: true, banReason: r, banUntil, bannedAt: Date.now() }); await log('حظر مستخدم', `${uid} - ${duration} - ${r}`); ok(`تم الحظر`); } catch(e) { bad(e); } };
window.adminAdjustBalance = async (uid) => { if (!uid || uid === 'admin_support') return; try { const userSnap = await get(R('users/'+uid)); const currentBalance = Number(userSnap.val().balance) || 0; const {value: opType} = await Swal.fire({ title: 'نوع العملية', html: `<p style="margin-bottom:10px; font-size:14px; font-weight:bold;">الرصيد الحالي: <span style="color:green;">${currentBalance} ج</span></p>`, input: 'select', inputOptions: { 'add': 'إضافة رصيد (+)', 'deduct': 'خصم رصيد (-)' }, showCancelButton: true, confirmButtonText: 'متابعة', cancelButtonText: 'إلغاء' }); if (!opType) return; const r = await Swal.fire({ title: opType === 'add' ? 'المبلغ' : 'المبلغ', input:'number', inputAttributes: { min: 1 }, showCancelButton:true, confirmButtonText:'متابعة', cancelButtonText:'إلغاء' }); if(!r.isConfirmed || !r.value) return; let n = Math.abs(Math.round(+r.value)); if(!n || n <= 0) throw new Error('مبلغ غير صالح'); if (opType === 'deduct') n = -n; if ((currentBalance + n) < 0) throw new Error(`الرصيد لا يكفي.`); const why = await reason('سبب التعديل'); await confirmPIN('تعديل رصيد '+n); await credit(uid, n); await log('تعديل رصيد',`${uid}: ${n} (${why})`); await notify(uid,'تعديل رصيد',`${n>0?'+':''}${n} ج — ${why}`); ok('تم'); } catch(e) { bad(e); } };

window.exportTable = (data, headers, name) => downloadExcel(data, headers, name);

const themeToggle = document.getElementById('theme-toggle');
if (themeToggle) {
    themeToggle.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        if(window.dealsChart) {
            window.dealsChart.options.plugins.legend.labels.color = isDark ? '#fafafa' : '#18181b';
            window.dealsChart.data.datasets[0].backgroundColor = isDark ? ['#10b981', '#f59e0b', '#ef4444'] : ['#059669', '#d97706', '#dc2626'];
            window.dealsChart.update('none');
        }
    });
}

let idleTimer;
function resetIdleTimer() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (me) { signOut(auth); Swal.fire({icon:'info', title:'انتهت الجلسة', text:'تسجيل خروج تلقائي.'}); } }, 1800000); }
['mousemove', 'keydown', 'scroll', 'touchstart'].forEach(evt => document.addEventListener(evt, resetIdleTimer, {passive:true, capture:true}));

onAuthStateChanged(auth,async u=>{
  if(!u){
    me=null;$('tabs-inner').innerHTML='';$('who').innerHTML='?';$('user-email').innerHTML='—';$('role-badge').innerHTML='—';clearTimeout(idleTimer);
    $('v').innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:80px;padding:0 20px;text-align:center"><div style="width:80px;height:80px;border-radius:20px;background:var(--text);display:flex;align-items:center;justify-content:center;color:var(--surface);font-size:32px;margin-bottom:20px;box-shadow:var(--shadow-lg)"><i class="fa-solid fa-user-shield"></i></div><h2 style="font-size:20px;font-weight:900;color:var(--text);margin-bottom:8px">دخول المشرفين</h2><p style="font-size:13px;color:var(--text-3);font-weight:700;margin-bottom:24px">سجّل الدخول للمتابعة إلى لوحة التحكم</p><button class="btn btn-primary" style="padding:14px 30px;font-size:14px;border-radius:12px;" onclick="signInAdmin()">الدخول بحساب Google</button></div>`;
    return;
  }
  try{
    const adminSnap = await get(R('admins/'+u.uid));
    if(!adminSnap.exists()){await signOut(auth);return Swal.fire({icon:'error',title:'غير مصرّح',text:'هذا الحساب ليس مشرفاً.'})}
    const adminData = adminSnap.val();
    const validRoles = ['owner', 'accountant', 'support', 'super_admin'];
    if (!validRoles.includes(adminData.role)) { await signOut(auth); return Swal.fire({icon:'error',title:'صلاحية غير صالحة',text:'دور هذا الحساب غير معروف. راجع المالك.'}); }
    me = { uid: u.uid, email: u.email, role: adminData.role, isOwner: adminData.role === 'owner' };
    $('who').innerHTML = u.email.charAt(0).toUpperCase();
    $('user-email').innerHTML = E(u.email.split('@')[0]);
    const roleLabel = me.isOwner ? 'المالك 👑' : me.role === 'accountant' ? 'محاسب' : me.role === 'support' ? 'دعم فني' : 'مدير عام';
    $('role-badge').innerText = roleLabel;
    onValue(R('settings'),s=>{ S=s.val()||{}; $('maintenance-banner').classList.toggle('hidden', !S.maintenanceMode); });
    resetIdleTimer(); checkPending(); 
    setInterval(checkPending, 60000);
    show('dash');
  }catch(e){await signOut(auth);bad(e)}
});
window.signInAdmin=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(bad);
</script>
